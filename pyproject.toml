[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-utils"
version = "0.1.0"
description = "Knowledge graph and hybrid RAG search for any project (used by the Digital Paragon RAG sidecar)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vladimir" }]
keywords = ["mcp", "rag", "knowledge-graph", "code-search", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "sentence-transformers>=2.7",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "gitignore-parser>=0.1.11",
    "diskcache>=5.6",
    "numpy>=1.26",
    "tqdm>=4.66",
    "json5>=0.9",
    "networkx>=3.0",
]

[project.optional-dependencies]
llm = ["httpx>=0.27"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/py_utils"]
